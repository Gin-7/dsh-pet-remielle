<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>蕾米埃尔桌宠</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body {
    width: 100vw; height: 100vh;
    display: flex; align-items: flex-end; justify-content: center;
    user-select: none; -webkit-user-select: none;
    font-family: system-ui, sans-serif;
  }
  .pet { position: relative; display: flex; flex-direction: column; align-items: center; }
  .bubble {
    display: none;
    margin-bottom: 10px; padding: 8px 12px;
    min-width: 170px; max-width: 340px;
    border-radius: 10px;
    background: #fff0f5;
    border: 1px solid rgba(240, 120, 160, .45);
    box-shadow: 0 6px 20px rgba(190, 70, 110, .20);
    font-size: 12px; line-height: 1.45; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bubble::after {
    content: ""; position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: rgba(240, 120, 160, .45);
  }
  .bubble-title { font-weight: 600; color: #b03a60; }
  .bubble-detail { color: #c2607f; margin-top: 2px; font-size: 11px; }
  /* 气泡翻页圆点 */
  .bubble-dots { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 5px; pointer-events: auto; z-index: 1; }
  .bubble-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(240,120,160,.25); cursor: pointer; transition: background .2s; }
  .bubble-dot.active { background: #b03a60; }
  /* 气泡翻页圆点 */
  .bubble-dots { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 5px; pointer-events: auto; z-index: 1; }
  .bubble-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(240,120,160,.25); cursor: pointer; transition: background .2s; }
  .bubble-dot.active { background: #b03a60; }
  /* 气泡翻页圆点 */
  .bubble-dots { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 5px; pointer-events: auto; z-index: 1; }
  .bubble-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(240,120,160,.25); cursor: pointer; transition: background .2s; }
  .bubble-dot.active { background: #b03a60; }
  img { width: 180px; height: auto; display: block; }
  @media (prefers-color-scheme: dark) {
    .bubble { background: rgba(72, 20, 42, .96); border-color: rgba(255, 150, 185, .42); }
    .bubble::after { border-top-color: rgba(255, 150, 185, .42); }
    .bubble-title { color: #ffd6e4; }
    .bubble-detail { color: #f0a8c0; }
    .menu { background: rgba(72, 20, 42, .96); border-color: rgba(255, 150, 185, .42); color: #ffd6e4; }
    .menu-item:hover { background: rgba(255, 150, 185, .16); }
    .menu-item .tick { color: #ffb3c9; }
    .menu-item .mute { color: #f0a8c0; }
    .menu-sep { background: rgba(255, 150, 185, .25); }
  }
  /* Right-click menu — pink palette, matching the status bubble and the
     in-page pet menu (both sides use the same hardcoded pink values). */
  .menu {
    display: none; position: fixed; z-index: 999;
    min-width: 200px;
    background: #fff0f5;
    border: 1px solid rgba(240, 120, 160, .45);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(190, 70, 110, .22);
    padding: 6px;
    font-family: system-ui, sans-serif;
    font-size: 13px; color: #8a2f52;
    user-select: none; -webkit-user-select: none;
  }
  .menu-item { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 7px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  .menu-item:hover { background: rgba(240, 120, 160, .14); }
  .menu-item .tick { color: #b03a60; font-weight: 600; }
  .menu-item .mute { color: #c2607f; font-size: 12px; }
  .menu-sep { height: 1px; background: rgba(240, 120, 160, .25); margin: 5px 6px; }
  .menu-status { opacity: .85; cursor: default; }
</style>
</head>
<body>
  <script src="/plugins/dsh-pet-remielle/balance-widget.js"></script>
  <div class="menu" id="menu"></div>
  <div class="pet">
    <div class="bubble" id="bubble" style="position:relative;">
      <div class="bubble-title" id="title"></div>
      <div class="bubble-detail" id="detail"></div>
      <div class="bubble-dots">
        <div class="bubble-dot active" id="dot0" title="状态"></div>
        <div class="bubble-dot" id="dot1" title="余额"></div>
      </div>
    </div>
    <img id="pet" alt="蕾米埃尔" draggable="false">
  </div>
<script>
  var bubbleEl = document.getElementById('bubble')
  var titleEl = document.getElementById('title')
  var detailEl = document.getElementById('detail')
  var imgEl = document.getElementById('pet')
  var dot0El = document.getElementById('dot0')
  var dot1El = document.getElementById('dot1')
  var currentBubblePage = 0
  function switchBubblePage(p) {
    currentBubblePage = p
    dot0El.className = 'bubble-dot' + (p === 0 ? ' active' : '')
    dot1El.className = 'bubble-dot' + (p === 1 ? ' active' : '')
    if (p === 0) {
      balanceFrame = null
      lastBubbleMood = ''; lastBubbleText = ''; lastBubbleDetail = ''
      if (lastSnapshot) apply(lastSnapshot)
      if (window.__petBalance && window.__petBalance.showStatus) window.__petBalance.showStatus()
    } else if (p === 1 && window.__petBalance && window.__petBalance.showBalance) {
      window.__petBalance.showBalance()
    }
  }
  dot0El.addEventListener('click', function (e) { e.stopPropagation(); switchBubblePage(0) })
  dot1El.addEventListener('click', function (e) { e.stopPropagation(); switchBubblePage(1) })
  bubbleEl.addEventListener('wheel', function (e) {
    e.preventDefault(); e.stopPropagation()
    switchBubblePage(currentBubblePage === 0 ? 1 : 0)
  }, { passive: false })
  var picEl = document.createElement('img')
  picEl.style.cssText = 'position:fixed;right:24px;top:24px;width:220px;height:auto;border-radius:10px;box-shadow:0 8px 24px rgba(15,30,72,.3);display:none;cursor:pointer;'
  picEl.title = '点击关闭'
  picEl.addEventListener('click', function () { picEl.style.display = 'none' })
  document.body.appendChild(picEl)
  var lastSnapshot = null
  var balanceFrame = null
  var petPaused = false
  var petAnimatedSrc = null
  function setPetPaused(v) {
    if (v === petPaused) return
    petPaused = v
    if (v) {
      // 暂停 GIF：把当前帧冻结成静态图
      try {
        var cv = document.createElement('canvas')
        cv.width = imgEl.naturalWidth || 180
        cv.height = imgEl.naturalHeight || 180
        var g = cv.getContext('2d')
        g.drawImage(imgEl, 0, 0, cv.width, cv.height)
        petAnimatedSrc = imgEl.src
        imgEl.src = cv.toDataURL('image/png')
      } catch (e) { /* 冻结失败则忽略 */ }
    } else {
      if (petAnimatedSrc) { imgEl.src = petAnimatedSrc; petAnimatedSrc = null }
      imgEl.dataset.mood = '' // 强制下次 apply 重新设置正确贴纸
    }
  }
  var BUBBLE_TITLE_MS = 2000
  var lastBubbleMood = ''
  var lastBubbleText = ''
  var lastBubbleTitleAt = 0
  var lastBubbleDetail = ''
  var clickThrough = false
  var dragState = null
  var menuOpen = false
  var lockedNow = false
  var moodOverride = null
  var menuEl = document.getElementById('menu')

  // --- click-through: transparent window margins must not block the desktop ---
  // The pet image (and a popped artwork) is interactive; everything else lets
  // the cursor pass through to whatever is behind the window. The main process
  // forwards mouse moves while pass-through is on, so hovering back onto the
  // pet flips it off again.
  function hitInteractive(e) {
    var el = document.elementFromPoint(e.clientX, e.clientY)
    if (!el || !el.closest) return false
    // pet image, artwork popup, status/balance bubble, or the right-click
    // menu — anything else passes through
    return Boolean(el.closest('img') || el.closest('#menu') || el.closest('.bubble'))
  }
  function syncClickThrough(e) {
    if (dragState) return // keep the window interactive while dragging
    if (menuOpen) {
      if (!clickThrough) { clickThrough = true; if (window.petBridge) window.petBridge.setClickThrough(false) }
      return
    }
    var on = !hitInteractive(e)
    if (on === clickThrough) return
    clickThrough = on
    if (window.petBridge) window.petBridge.setClickThrough(on)
  }
  window.addEventListener('mousemove', syncClickThrough, { passive: true })

  // --- right-click menu (same shape as the in-page pet) ---
  function menuRow(label, value, onClick, interactive) {
    var row = document.createElement('div')
    row.className = 'menu-item' + (interactive ? '' : ' menu-status')
    var text = document.createElement('span')
    text.textContent = label
    row.appendChild(text)
    if (value !== null && value !== undefined) {
      var mark = document.createElement('span')
      mark.className = 'tick'
      mark.textContent = value ? '✓' : ''
      row.appendChild(mark)
    }
    if (onClick) row.addEventListener('click', onClick)
    return row
  }
  function menuSep() {
    var sep = document.createElement('div')
    sep.className = 'menu-sep'
    return sep
  }
  // Size slider row: live-preview via apply() and persist via /config.
  function menuSliderRow() {
    var row = document.createElement('div')
    row.className = 'menu-item'
    var label = document.createElement('span')
    label.textContent = '角色大小'
    var slider = document.createElement('input')
    slider.type = 'range'
    slider.min = 0.5
    slider.max = 2
    slider.step = 0.05
    slider.style.cssText = 'width:110px;margin:0 4px;'
    var pct = document.createElement('span')
    pct.className = 'tick'
    pct.style.cssText = 'min-width:42px;text-align:right;font-size:12px;'
    var cur = (lastSnapshot && lastSnapshot.scale) || 1
    slider.value = String(cur)
    pct.textContent = Math.round(cur * 100) + '%'
    slider.addEventListener('input', function () {
      var next = Number(slider.value)
      pct.textContent = Math.round(next * 100) + '%'
      fetch('/plugins/dsh-pet-remielle/config', {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ scale: next }),
      }).catch(function () {})
      if (lastSnapshot) {
        lastSnapshot.scale = next
        apply(lastSnapshot) // live preview: width + offset transform
      }
    })
    row.appendChild(label)
    row.appendChild(slider)
    row.appendChild(pct)
    return row
  }
  function buildMenu() {
    menuEl.textContent = ''
    var snap = lastSnapshot
    var running = snap && (snap.state === 'THINKING' || snap.state === 'WORKING' || snap.state === 'WAITING' || snap.state === 'ERROR')
    menuEl.appendChild(menuRow((snap ? snap.message : '连接中') + (running ? ' · 运行中' : ''), null, null))
    menuEl.appendChild(menuSep())
    menuEl.appendChild(menuSliderRow())
    menuEl.appendChild(menuRow('锁定位置', lockedNow, function () {
      lockedNow = !lockedNow
      fetch('/plugins/dsh-pet-remielle/config', {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ locked: lockedNow }),
      }).catch(function () {})
      buildMenu()
    }, true))
    menuEl.appendChild(menuRow('显示气泡', snap ? snap.bubble !== false : true, function () {
      var next = !(snap ? snap.bubble !== false : true)
      fetch('/plugins/dsh-pet-remielle/config', {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ showBubble: next }),
      }).catch(function () {})
      if (snap) { snap.bubble = next; apply(snap) }
      buildMenu()
    }, true))
    menuEl.appendChild(menuRow('画画', null, function () { playDraw(); closeMenu() }, true))
    // 用量模式：小鲸鱼记账（免令牌） / 实时·令牌（精确）
    var umRow = document.createElement('div')
    umRow.className = 'menu-item'
    var umLabel = document.createElement('span')
    umLabel.textContent = '用量模式'
    var umSelect = document.createElement('select')
    umSelect.style.cssText = 'flex:1;border:1px solid rgba(240,120,160,.4);border-radius:6px;background:rgba(240,120,160,.08);color:#8a2f52;font-size:12px;padding:3px 0;cursor:pointer;'
    function umOpt(value, text) { var o = document.createElement('option'); o.value = value; o.textContent = text; return o }
    umSelect.appendChild(umOpt('ledger', '小鲸鱼记账'))
    umSelect.appendChild(umOpt('token', '实时·令牌'))
    umSelect.value = snap && snap.usageMode === 'token' ? 'token' : 'ledger'
    umSelect.addEventListener('change', function () {
      fetch('/plugins/dsh-pet-remielle/config', {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ usageMode: umSelect.value }),
      }).catch(function () {})
    })
    umRow.appendChild(umLabel)
    umRow.appendChild(umSelect)
    menuEl.appendChild(umRow)
    menuEl.appendChild(menuSep())
    menuEl.appendChild(menuRow('切换到网页模式', null, function () {
      // 与设置同步：先确保 desktopMode=false 写入成功，宿主 watch 会关停
      // 桌面窗并恢复页面内宠物；窗口本身随后关闭。
      fetch('/plugins/dsh-pet-remielle/config', {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ desktopMode: false }),
      }).catch(function () {}).then(function () { window.close() })
    }, true))
  }
  // Menu anchors to the character's top-right corner (outside the pet, never
  // covering it). Falls back: top-left when the right side is too narrow,
  // then above the pet when neither side fits (small desktop window).
  function openMenuAt() {
    buildMenu()
    menuEl.style.display = 'block'
    var mw = menuEl.offsetWidth
    var mh = menuEl.offsetHeight
    var W = window.innerWidth || 380
    var H = window.innerHeight || 430
    var r = imgEl.getBoundingClientRect()
    var left, top
    if (r.right + 8 + mw <= W - 4) {
      left = r.right + 8
      top = Math.max(4, Math.min(r.top, H - mh - 4))
    } else if (r.left - 8 - mw >= 4) {
      left = r.left - mw - 8
      top = Math.max(4, Math.min(r.top, H - mh - 4))
    } else {
      left = Math.max(4, Math.min(r.right - mw, W - mw - 4))
      top = Math.max(4, r.top - mh - 8)
    }
    menuEl.style.left = left + 'px'
    menuEl.style.top = top + 'px'
    menuOpen = true
  }
  function closeMenu() {
    menuOpen = false
    menuEl.style.display = 'none'
  }
  document.addEventListener('pointerdown', function (e) {
    if (menuOpen && !menuEl.contains(e.target)) closeMenu()
  }, true)
  window.addEventListener('contextmenu', function (e) {
    e.preventDefault()
    openMenuAt()
  })

  // --- drag: only from the pet image, JS-driven window move ---
  function syncCursor() {
    imgEl.style.cursor = lockedNow ? 'default' : 'grab'
  }
  imgEl.addEventListener('mousedown', function (e) {
    if (e.button !== 0 || lockedNow) return
    dragState = { x: e.screenX, y: e.screenY, moved: false }
    imgEl.style.cursor = 'grabbing'
  })
  window.addEventListener('mousemove', function (e) {
    if (!dragState) return
    if (!(e.buttons & 1)) { dragState = null; syncCursor(); return } // mouse released outside
    var dx = e.screenX - dragState.x
    var dy = e.screenY - dragState.y
    if (Math.abs(dx) + Math.abs(dy) > 6) dragState.moved = true
    if (window.petBridge) {
      window.petBridge.moveWindow(dx, dy)
    }
    dragState = { x: e.screenX, y: e.screenY, moved: dragState.moved }
  })
  window.addEventListener('mouseup', function () {
    if (dragState && !dragState.moved) {
      // plain click: switch mood, same as the in-page pet
      var moods = ['01', '02', '03', '04', '05', '06', '07']
      var current = lastSnapshot ? (lastSnapshot.mood || '06') : '06'
      var pick = moods.filter(function (m) { return m !== current })
      moodOverride = { mood: pick[Math.floor(Math.random() * pick.length)], until: Date.now() + 1800 }
      apply(lastSnapshot)
    }
    dragState = null
    syncCursor()
  })

  function applyTransform(mood, snapshot) {
    var scale = snapshot.scale || 1
    imgEl.style.width = Math.round(180 * scale) + 'px'
    imgEl.style.transform = ''
  }

  function apply(snapshot) {
    if (!snapshot) return
    lastSnapshot = snapshot
    if (window.__petBalance) {
      if (!window.__petBalanceInited) {
        window.__petBalanceInited = true
        window.__petBalance.init(snapshot.usageMode || 'ledger')
      } else if (snapshot.usageMode) {
        window.__petBalance.setUsageMode(snapshot.usageMode)
      }
    }
    lockedNow = snapshot.locked === true
    syncCursor()
    // 禁用桌宠或隐藏桌宠：隐藏宠物与气泡
    if (snapshot.enabled === false || snapshot.hidden === true) {
      imgEl.style.display = 'none'
      bubbleEl.style.display = 'none'
      return
    }
    imgEl.style.display = 'block'
    setPetPaused(snapshot.paused === true)
    var mood = moodOverride && moodOverride.until > Date.now() ? moodOverride.mood : (snapshot.mood || '06')
    var src = '/plugins/dsh-pet-remielle/assets/' + encodeURIComponent(snapshot.petId || 'remielle') + '/' + mood + '.gif'
    if (!petPaused && imgEl.dataset.mood !== mood) {
      imgEl.src = src
      imgEl.dataset.mood = mood
    }
    applyTransform(mood, snapshot)
    imgEl.style.opacity = String(snapshot.opacity ?? 1)
    // 余额/随机台词模式下，气泡内容由余额控制器渲染，不被会话状态覆盖
    if (balanceFrame && balanceFrame.kind === 'balance') {
      bubbleEl.style.display = 'block'
      return
    }
    var show = snapshot.bubble !== false && Boolean(snapshot.detail)
    if (show) {
      // 标题：mood 未变时最多每 BUBBLE_TITLE_MS 换一次（think/输出不逐 chunk 翻），
      // mood/阶段切换则立即更新；详情（进度/任务）随变化即时更新。
      var now = Date.now()
      var moodChanged = snapshot.mood !== lastBubbleMood
      if (moodChanged || (snapshot.message !== lastBubbleText && now - lastBubbleTitleAt >= BUBBLE_TITLE_MS)) {
        lastBubbleTitleAt = now
        lastBubbleMood = snapshot.mood
        lastBubbleText = snapshot.message || ''
        titleEl.textContent = snapshot.message || ''
      }
      if (snapshot.detail !== lastBubbleDetail) {
        lastBubbleDetail = snapshot.detail || ''
        detailEl.textContent = snapshot.detail || ''
      }
    }
    bubbleEl.style.display = show ? 'block' : 'none'
  }

  var source
  try { source = new EventSource('/plugins/dsh-pet-remielle/stream') } catch (e) { /* fallback to polling */ }
  if (source) {
    source.onmessage = function (e) {
      try { apply(JSON.parse(e.data)) } catch (err) { /* ignore malformed frame */ }
    }
  }
  function poll() {
    fetch('/plugins/dsh-pet-remielle/state', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null })
      .then(apply)
      .catch(function () {})
  }
  setInterval(poll, 5000)
  poll()

  // 余额控制器：把显示帧渲染进自带气泡
  if (window.__petBalance) {
    window.__petBalance.subscribe(function (frame) {
      balanceFrame = frame
      if (frame.kind === 'balance') {
        titleEl.textContent = (frame.label || 'DeepSeek 余额') + '  ' + frame.amount
        titleEl.style.color = ''
        detailEl.innerHTML = frame.detail + ' · <span style="color:' + (frame.color || '') + '">' + frame.period + '</span>'
        bubbleEl.style.display = 'block'
      } else if (frame.kind === 'status') {
        balanceFrame = null
        // 清掉状态气泡的节流缓存，强制恢复会话状态内容
        lastBubbleMood = ''
        lastBubbleText = ''
        lastBubbleDetail = ''
        if (lastSnapshot) apply(lastSnapshot)
      }
    })
  }

  // Double-click (or menu 画画): drawing sticker loop + brush-reveal artwork.
  // Renders off-screen and streams frames to a desktop-top-right window (via
  // petBridge) so it never covers the pet bubble; falls back to an in-window
  // canvas if no bridge is available.
  function playDraw() {
    if (!lastSnapshot || !lastSnapshot.pics) return
    var PIC_DRAW_MS = 6000 // 绘制时长 == 显示“绘制中(01)”的时长
    moodOverride = { mood: '01', until: Date.now() + PIC_DRAW_MS }
    apply(lastSnapshot)
    var n = Math.floor(Math.random() * lastSnapshot.pics) + 1
    var src = '/plugins/dsh-pet-remielle/assets/' + encodeURIComponent(lastSnapshot.petId || 'remielle') + '/pics/' + n + '.png'
    var img = new Image()
    img.onload = function () {
      runBrushReveal(img, img.naturalWidth || 220, img.naturalHeight || 220)
    }
    img.src = src
  }

  function runBrushReveal(img, W, H) {
    var useElectron = !!(window.petBridge && window.petBridge.artworkOpen && window.petBridge.artworkSet)
    // 显示尺寸（约 240px 宽，控制高度上限，保证 PNG 帧不至于过大）
    var dispW = 240
    var dispH = Math.max(60, Math.min(420, Math.round(240 * H / W)))
    var cv = document.createElement('canvas')
    cv.width = dispW; cv.height = dispH
    var g = cv.getContext('2d')
    g.clearRect(0, 0, dispW, dispH)
    var D = dispW + dispH
    var r = Math.max(dispW, dispH) * 0.15
    var T = 6000
    var t0 = null
    var shown = false
    var lastPush = -1

    function openTarget() {
      if (useElectron) {
        window.petBridge.artworkOpen(dispW, dispH)
      } else {
        cv.style.cssText = 'position:fixed;right:24px;top:24px;width:' + dispW + 'px;height:auto;border-radius:10px;display:block;cursor:pointer;z-index:9999;'
        cv.title = '点击关闭'
        cv.addEventListener('click', function () { if (cv.parentNode) document.body.removeChild(cv) })
        document.body.appendChild(cv)
      }
      shown = true
    }
    function pushFrame(now) {
      if (!shown) openTarget()
      if (!useElectron) return // 窗口内画布本身就是实时显示的
      if (now - lastPush < 33) return // ~30fps，避免 IPC 过载
      lastPush = now
      window.petBridge.artworkSet(cv.toDataURL('image/png'))
    }
    function lineAt(dd) {
      var ax = Math.max(0, dd - dispH), ay = dd - ax
      var by = Math.max(0, dd - dispW), bx = dd - by
      return { ax: ax, ay: ay, bx: bx, by: by }
    }
    function frame(ts) {
      if (t0 === null) t0 = ts
      var p = Math.min(1, (ts - t0) / T)
      if (p >= 1) {
        g.globalAlpha = 1
        g.globalCompositeOperation = 'source-over'
        g.drawImage(img, 0, 0, W, H, 0, 0, dispW, dispH)
        pushFrame(ts)
        // 绘制完成：切“得意中(03)”，保持片刻后 0.8s 淡出再关闭
        moodOverride = { mood: '03', until: Date.now() + 2200 }
        apply(lastSnapshot)
        setTimeout(function () {
          if (useElectron) window.petBridge.artworkFade()
          else if (cv.parentNode) {
            cv.style.transition = 'opacity 0.8s ease-out'
            cv.style.opacity = '0'
          }
          setTimeout(function () {
            if (useElectron) window.petBridge.artworkClose()
            else if (cv.parentNode) document.body.removeChild(cv)
          }, 800)
        }, 2200)
        return
      }
      var d = D * p
      var L = lineAt(d)
      var half = 440
      var ph = (ts - t0) % (half * 2)
      var s = ph < half ? ph / half : 1 - (ph - half) / half
      for (var k = 0; k < 2; k++) {
        var sk = Math.min(1, Math.max(0, s + k * 0.04))
        var cx = L.bx + (L.ax - L.bx) * sk
        var cy = L.by + (L.ay - L.by) * sk
        // 笔刷路径加一点小小的随机
        cx += (Math.random() - 0.5) * r * 0.6
        cy += (Math.random() - 0.5) * r * 0.6
        var rr = r * (0.85 + 0.3 * Math.random())
        g.save()
        g.beginPath()
        g.arc(cx, cy, rr, 0, Math.PI * 2)
        g.clip()
        g.globalAlpha = 1
        g.globalCompositeOperation = 'source-over'
        g.drawImage(img, 0, 0, W, H, 0, 0, dispW, dispH)
        g.restore()
      }
      pushFrame(ts)
      window.requestAnimationFrame(frame)
    }
    window.requestAnimationFrame(frame)
  }
  window.addEventListener('dblclick', playDraw)

  // Mouse wheel: resize the pet (persisted through host config).
  window.addEventListener('wheel', function (e) {
    e.preventDefault()
    if (!lastSnapshot) return
    var delta = e.deltaY < 0 ? 0.05 : -0.05
    var next = Math.min(2, Math.max(0.5, (lastSnapshot.scale || 1) + delta))
    next = Math.round(next * 20) / 20
    fetch('/plugins/dsh-pet-remielle/config', {
      method: 'PATCH',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ scale: next }),
    }).catch(function () {})
  }, { passive: false })

  // Remember the window position across restarts.
  try {
    var saved = JSON.parse(localStorage.getItem('dsh-pet-window-pos') || 'null')
    if (saved && typeof saved.x === 'number' && typeof saved.y === 'number') {
      window.moveTo(saved.x, saved.y)
    }
  } catch (e) { /* storage unavailable */ }
  setInterval(function () {
    try {
      localStorage.setItem('dsh-pet-window-pos', JSON.stringify({ x: window.screenX, y: window.screenY }))
    } catch (e) { /* storage unavailable */ }
  }, 2000)
</script>
