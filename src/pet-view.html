<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>蕾米埃尔桌宠</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body {
    width: 100vw; height: 100vh;
    display: flex; align-items: flex-end; justify-content: center;
    user-select: none; -webkit-user-select: none;
    font-family: system-ui, sans-serif;
  }
  .pet { position: relative; display: flex; flex-direction: column; align-items: center; }
  .rm2-pet-bubbles {
    position: relative;
    margin-bottom: 12px;
    width: fit-content;
    max-width: min(330px, calc(100vw - 24px));
    display: none;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  .rm2-pet-bubble {
    display: none;
    position: relative;
    margin-bottom: 10px;
    box-sizing: border-box;
    min-width: 150px;
    max-width: min(330px, calc(100vw - 24px));
    padding: 12px 20px 12px 30px;
    border-radius: 22px;
    background: #fff0f5;
    border: 1px solid rgba(240, 120, 160, .45);
    box-shadow: 0 6px 20px rgba(190, 70, 110, .20);
    font-size: 12px;
    line-height: 1.45;
    text-align: left;
    white-space: nowrap;
  }
  .rm2-pet-bubbles .rm2-pet-bubble {
    margin: 0;
    width: fit-content;
    height: 68px;
    min-height: 68px;
    box-shadow: 0 8px 24px rgba(190, 70, 110, .25);
    pointer-events: auto;
    cursor: pointer;
    overflow: hidden;
    transition: width .18s ease, opacity .18s ease;
  }
  .rm2-pet-bubble-title { font-weight: 600; color: #b03a60; min-width: 0; flex: none; white-space: nowrap; overflow: visible; text-overflow: clip; line-height: 1.35; }
  .rm2-pet-bubble-detail { color: #c2607f; margin-top: 2px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .rm2-pet-bubble-header { display: flex; align-items: center; min-width: 0; min-height: 22px; }
  .rm2-pet-bubble.title-clipped .rm2-pet-bubble-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .rm2-pet-bubble-action { display: inline-flex; flex: none; order: 2; align-items: center; justify-content: center; width: 22px; height: 22px; margin-left: 8px; margin-right: 0; border-radius: 50%; background: #e8508a; color: #fff; font-size: 15px; font-weight: 700; line-height: 1; }
  .rm2-pet-bubble-action img { width: 15px; height: 15px; display: block; filter: brightness(0) saturate(100%) invert(1); }
  .rm2-pet-bubble-completion { display: none; flex: none; width: 12px; height: 12px; margin-right: 10px; border-radius: 50%; background: #35c979; box-shadow: 0 0 0 3px rgba(53,201,121,.18); }
  .rm2-pet-bubble.completed .rm2-pet-bubble-completion { display: inline-flex; }
  .rm2-pet-bubble.idle-placeholder { height: 46px; min-height: 46px; padding-top: 11px; padding-bottom: 11px; }
  .rm2-pet-bubble-stack-count { display: none; position: absolute; right: 16px; bottom: 0; height: 8px; align-items: center; color: #f0a8c0; font-size: 9px; font-weight: 700; line-height: 8px; }
  .rm2-pet-bubble.summary-backboard .rm2-pet-bubble-stack-count { display: flex; }
  .rm2-pet-bubbles .rm2-pet-bubble:not(.top) .rm2-pet-bubble-title,
  .rm2-pet-bubbles .rm2-pet-bubble:not(.top) .rm2-pet-bubble-detail,
  .rm2-pet-bubbles .rm2-pet-bubble:not(.top) .rm2-pet-bubble-action,
  .rm2-pet-bubbles .rm2-pet-bubble:not(.top) .rm2-pet-bubble-completion { visibility: hidden; }
  .rm2-pet-bubble.top { border-color: #b03a60; box-shadow: 0 10px 28px rgba(190, 70, 110, .38); }
  .rm2-pet-bubble.attention { border-color: #e8508a; animation: rm2-pet-attention 1.6s ease-in-out infinite; }
  @keyframes rm2-pet-attention { 0%,100% { box-shadow: 0 0 0 0 rgba(232,80,138,.35); } 50% { box-shadow: 0 0 0 6px rgba(232,80,138,0); } }
  .rm2-bubble-dots { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; pointer-events: auto; z-index: 120; }
  .rm2-bubble-dot { width: 10px; height: 10px; border-radius: 50%; background: #e8508a; cursor: pointer; box-shadow: 0 0 0 2px rgba(255,255,255,.65); transition: transform .18s, background .18s; }
  .rm2-bubble-dot:hover { transform: scale(1.25); }
  .rm2-bubble-balance { box-sizing: border-box; height: 68px; min-height: 68px; max-width: 330px; }
  .rm2-bubble-balance .rm2-pet-bubble-title { line-height: 22px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  img { width: 180px; height: auto; display: block; }
  @media (prefers-color-scheme: dark) {
    .rm2-pet-bubble { background: rgba(72, 20, 42, .96); border-color: rgba(255, 150, 185, .42); }
    .rm2-pet-bubble-title { color: #ffd6e4; }
    .rm2-pet-bubble-detail { color: #f0a8c0; }
    .rm2-pet-bubble.top { border-color: #ffb3c9; }
    .rm2-pet-bubble.attention { border-color: #ff6fa8; }
    .menu { background: rgba(72, 20, 42, .96); border-color: rgba(255, 150, 185, .42); color: #ffd6e4; }
    .menu-item:hover { background: rgba(255, 150, 185, .16); }
    .menu-item .tick { color: #ffb3c9; }
    .menu-item .mute { color: #f0a8c0; }
    .menu-sep { background: rgba(255, 150, 185, .25); }
  }
  /* Right-click menu — pink palette, matching the status bubble and the
     in-page pet menu (both sides use the same hardcoded pink values). */
  .menu {
    display: none; position: fixed; z-index: 999;
    min-width: 200px;
    background: #fff0f5;
    border: 1px solid rgba(240, 120, 160, .45);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(190, 70, 110, .22);
    padding: 6px;
    font-family: system-ui, sans-serif;
    font-size: 13px; color: #8a2f52;
    user-select: none; -webkit-user-select: none;
  }
  .menu-item { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 7px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  .menu-item:hover { background: rgba(240, 120, 160, .14); }
  .menu-item .tick { color: #b03a60; font-weight: 600; }
  .menu-item .mute { color: #c2607f; font-size: 12px; }
  .menu-sep { height: 1px; background: rgba(240, 120, 160, .25); margin: 5px 6px; }
  .menu-status { opacity: .85; cursor: default; }
</style>
</head>
<body>
  <script src="/plugins/dsh-pet-remielle/balance-widget.js"></script>
  <div class="menu" id="menu"></div>
  <div class="pet">
    <div class="rm2-pet-bubbles" id="bubbleStack"></div>
    <div class="rm2-pet-bubble top" id="bubble" style="position:relative;">
      <div class="rm2-pet-bubble-title" id="title"></div>
      <div class="rm2-pet-bubble-detail" id="detail"></div>
      <div class="rm2-bubble-dots" id="bubbleDots">
        <div class="rm2-bubble-dot" id="bubbleDot" title="切到余额"></div>
      </div>
    </div>
    <img id="pet" alt="蕾米埃尔" draggable="false">
  </div>
<script>
  var bubbleEl = document.getElementById('bubble')
  var titleEl = document.getElementById('title')
  var detailEl = document.getElementById('detail')
  var imgEl = document.getElementById('pet')
  var bubbleStack = document.getElementById('bubbleStack')
  var bubbleDots = document.getElementById('bubbleDots')
  var bubbleDot = document.getElementById('bubbleDot')
  var currentBubblePage = 0
  var prevBubbleVisible = false
  var balanceRequested = false
  var SESSION_OPEN_ENDPOINT = '/plugins/dsh-pet-remielle/session/open'
  var BUBBLE_MIN_W = 208
  var MAX_BUBBLES = 2
  var currentSessionId = undefined
  var lastTopEntry = null
  var bubbleEls = new Map()
  var __petMeasureEl = null
  function ensureMeasureEl() {
    if (!__petMeasureEl) {
      __petMeasureEl = document.createElement('span')
      __petMeasureEl.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;'
      document.body.appendChild(__petMeasureEl)
    }
    return __petMeasureEl
  }
  function measureTextW(srcEl, text) {
    var el = ensureMeasureEl()
    if (window.getComputedStyle && srcEl) {
      var cs = window.getComputedStyle(srcEl)
      el.style.fontFamily = cs.fontFamily
      el.style.fontSize = cs.fontSize
      el.style.fontWeight = cs.fontWeight
      el.style.letterSpacing = cs.letterSpacing
    }
    el.textContent = text || ''
    return el.offsetWidth || 0
  }
  function bubbleRowWidth(textW) {
    var vw = Math.max(150, (window.innerWidth || 1280) - 24)
    return Math.min(330, vw, Math.max(BUBBLE_MIN_W, textW + 50))
  }
  function switchBubblePage(p) {
    currentBubblePage = p
    bubbleDot.title = p === 0 ? '切到余额' : '切到状态'
    if (p === 0) {
      balanceFrame = null
      lastBubbleMood = ''; lastBubbleText = ''; lastBubbleDetail = ''
      if (lastSnapshot) apply(lastSnapshot)
      if (window.__petBalance && window.__petBalance.showStatus) window.__petBalance.showStatus()
    } else if (p === 1 && window.__petBalance && window.__petBalance.showBalance) {
      window.__petBalance.showBalance()
    }
  }
  function onBubbleWheel(e) {
    e.preventDefault(); e.stopPropagation()
    if (lastSnapshot) {
      var so = lastSnapshot.showBubble !== false && lastSnapshot.showBubbleStatus !== false
      var uo = lastSnapshot.showBubble !== false && lastSnapshot.showBubbleUsage === true
      if (!(so && uo)) return
    }
    switchBubblePage(currentBubblePage === 0 ? 1 : 0)
  }
  bubbleDot.addEventListener('click', function (e) { e.stopPropagation(); switchBubblePage(currentBubblePage === 0 ? 1 : 0) })
  bubbleEl.addEventListener('wheel', onBubbleWheel, { passive: false })
  bubbleStack.addEventListener('wheel', onBubbleWheel, { passive: false })
  var picEl = document.createElement('img')
  picEl.style.cssText = 'position:fixed;right:24px;top:24px;width:220px;height:auto;border-radius:10px;box-shadow:0 8px 24px rgba(15,30,72,.3);display:none;cursor:pointer;'
  picEl.title = '点击关闭'
  picEl.addEventListener('click', function () { picEl.style.display = 'none' })
  document.body.appendChild(picEl)
  var lastSnapshot = null
  var balanceFrame = null
  var petPaused = false
  var petAnimatedSrc = null
  function setPetPaused(v) {
    if (v === petPaused) return
    petPaused = v
    if (v) {
      // 暂停 GIF：把当前帧冻结成静态图
      try {
        var cv = document.createElement('canvas')
        cv.width = imgEl.naturalWidth || 180
        cv.height = imgEl.naturalHeight || 180
        var g = cv.getContext('2d')
        g.drawImage(imgEl, 0, 0, cv.width, cv.height)
        petAnimatedSrc = imgEl.src
        imgEl.src = cv.toDataURL('image/png')
      } catch (e) { /* 冻结失败则忽略 */ }
    } else {
      if (petAnimatedSrc) { imgEl.src = petAnimatedSrc; petAnimatedSrc = null }
      imgEl.dataset.mood = '' // 强制下次 apply 重新设置正确贴纸
    }
  }
  var BUBBLE_TITLE_MS = 2000
  var lastBubbleMood = ''
  var lastBubbleText = ''
  var lastBubbleDetail = ''
  var clickThrough = false
  var dragState = null
  var menuOpen = false
  var lockedNow = false
  var moodOverride = null
  var menuEl = document.getElementById('menu')

  // --- click-through: transparent window margins must not block the desktop ---
  // The pet image (and a popped artwork) is interactive; everything else lets
  // the cursor pass through to whatever is behind the window. The main process
  // forwards mouse moves while pass-through is on, so hovering back onto the
  // pet flips it off again.
  function hitInteractive(e) {
    var el = document.elementFromPoint(e.clientX, e.clientY)
    if (!el || !el.closest) return false
    // pet image, artwork popup, stacked/status/balance bubble, or the
    // right-click menu — anything else passes through
    return Boolean(el.closest('img') || el.closest('#menu') || el.closest('.rm2-pet-bubble') || el.closest('.rm2-pet-bubbles'))
  }
  function syncClickThrough(e) {
    if (dragState) return // keep the window interactive while dragging
    if (menuOpen) {
      if (!clickThrough) { clickThrough = true; if (window.petBridge) window.petBridge.setClickThrough(false) }
      return
    }
    var on = !hitInteractive(e)
    if (on === clickThrough) return
    clickThrough = on
    if (window.petBridge) window.petBridge.setClickThrough(on)
  }
  window.addEventListener('mousemove', syncClickThrough, { passive: true })

  // --- right-click menu (same shape as the in-page pet) ---
  function menuRow(label, value, onClick, interactive) {
    var row = document.createElement('div')
    row.className = 'menu-item' + (interactive ? '' : ' menu-status')
    var text = document.createElement('span')
    text.textContent = label
    row.appendChild(text)
    if (value !== null && value !== undefined) {
      var mark = document.createElement('span')
      mark.className = 'tick'
      mark.textContent = value ? '✓' : ''
      row.appendChild(mark)
    }
    if (onClick) row.addEventListener('click', onClick)
    return row
  }
  function menuSep() {
    var sep = document.createElement('div')
    sep.className = 'menu-sep'
    return sep
  }
  // Size slider row: live-preview via apply() and persist via /config.
  function menuSliderRow() {
    var row = document.createElement('div')
    row.className = 'menu-item'
    var label = document.createElement('span')
    label.textContent = '角色大小'
    var slider = document.createElement('input')
    slider.type = 'range'
    slider.min = 0.5
    slider.max = 2
    slider.step = 0.05
    slider.style.cssText = 'width:110px;margin:0 4px;'
    var pct = document.createElement('span')
    pct.className = 'tick'
    pct.style.cssText = 'min-width:42px;text-align:right;font-size:12px;'
    var cur = (lastSnapshot && lastSnapshot.scale) || 1
    slider.value = String(cur)
    pct.textContent = Math.round(cur * 100) + '%'
    slider.addEventListener('input', function () {
      var next = Number(slider.value)
      pct.textContent = Math.round(next * 100) + '%'
      fetch('/plugins/dsh-pet-remielle/config', {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ scale: next }),
      }).catch(function () {})
      if (lastSnapshot) {
        lastSnapshot.scale = next
        apply(lastSnapshot) // live preview: width + offset transform
      }
    })
    row.appendChild(label)
    row.appendChild(slider)
    row.appendChild(pct)
    return row
  }
  function buildMenu() {
    menuEl.textContent = ''
    var snap = lastSnapshot
    var running = snap && (snap.state === 'THINKING' || snap.state === 'WORKING' || snap.state === 'WAITING' || snap.state === 'ERROR')
    menuEl.appendChild(menuRow((snap ? snap.message : '连接中') + (running ? ' · 运行中' : ''), null, null))
    menuEl.appendChild(menuSep())
    menuEl.appendChild(menuSliderRow())
    menuEl.appendChild(menuRow('锁定位置', lockedNow, function () {
      lockedNow = !lockedNow
      fetch('/plugins/dsh-pet-remielle/config', {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ locked: lockedNow }),
      }).catch(function () {})
      buildMenu()
    }, true))
    menuEl.appendChild(menuRow('显示气泡', snap ? snap.bubble !== false : true, function () {
      var next = !(snap ? snap.bubble !== false : true)
      // 与设置中的总开关逻辑一致：关闭→全部子开关关闭；开启→全部子开关打开
      var body = { showBubble: next }
      if (!next) { body.showBubbleStatus = false; body.showBubbleUsage = false }
      else { body.showBubbleStatus = true; body.showBubbleUsage = true }
      fetch('/plugins/dsh-pet-remielle/config', {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      }).catch(function () {})
      if (snap) { snap.bubble = next; snap.showBubbleStatus = next; snap.showBubbleUsage = next; apply(snap) }
      buildMenu()
    }, true))
    menuEl.appendChild(menuRow('画画', null, function () { playDraw(); closeMenu() }, true))
    // 用量模式：小鲸鱼记账（免令牌） / 实时·令牌（精确）
    var umRow = document.createElement('div')
    umRow.className = 'menu-item'
    var umLabel = document.createElement('span')
    umLabel.textContent = '用量模式'
    var umSelect = document.createElement('select')
    umSelect.style.cssText = 'flex:1;border:1px solid rgba(240,120,160,.4);border-radius:6px;background:rgba(240,120,160,.08);color:#8a2f52;font-size:12px;padding:3px 0;cursor:pointer;'
    function umOpt(value, text) { var o = document.createElement('option'); o.value = value; o.textContent = text; return o }
    umSelect.appendChild(umOpt('ledger', '小鲸鱼记账'))
    umSelect.appendChild(umOpt('token', '实时·令牌'))
    umSelect.value = snap && snap.usageMode === 'token' ? 'token' : 'ledger'
    umSelect.addEventListener('change', function () {
      fetch('/plugins/dsh-pet-remielle/config', {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ usageMode: umSelect.value }),
      }).catch(function () {})
    })
    umRow.appendChild(umLabel)
    umRow.appendChild(umSelect)
    menuEl.appendChild(umRow)
    menuEl.appendChild(menuSep())
    menuEl.appendChild(menuRow('切换到网页模式', null, function () {
      // 与设置同步：先确保 desktopMode=false 写入成功，宿主 watch 会关停
      // 桌面窗并恢复页面内宠物；窗口本身随后关闭。
      fetch('/plugins/dsh-pet-remielle/config', {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ desktopMode: false }),
      }).catch(function () {}).then(function () { window.close() })
    }, true))
  }
  // Menu anchors to the character's top-right corner (outside the pet, never
  // covering it). Falls back: top-left when the right side is too narrow,
  // then above the pet when neither side fits (small desktop window).
  function openMenuAt() {
    buildMenu()
    menuEl.style.display = 'block'
    // 菜单打开时强制窗口可交互（关闭点击穿透），否则外部点击会落到桌面
    clickThrough = false
    if (window.petBridge) window.petBridge.setClickThrough(false)
    var mw = menuEl.offsetWidth
    var mh = menuEl.offsetHeight
    var W = window.innerWidth || 380
    var H = window.innerHeight || 430
    var r = imgEl.getBoundingClientRect()
    var left, top
    if (r.right + 8 + mw <= W - 4) {
      left = r.right + 8
      top = Math.max(4, Math.min(r.top, H - mh - 4))
    } else if (r.left - 8 - mw >= 4) {
      left = r.left - mw - 8
      top = Math.max(4, Math.min(r.top, H - mh - 4))
    } else {
      left = Math.max(4, Math.min(r.right - mw, W - mw - 4))
      top = Math.max(4, r.top - mh - 8)
    }
    menuEl.style.left = left + 'px'
    menuEl.style.top = top + 'px'
    menuOpen = true
  }
  function closeMenu() {
    menuOpen = false
    menuEl.style.display = 'none'
  }
  document.addEventListener('pointerdown', function (e) {
    if (menuOpen && !menuEl.contains(e.target)) closeMenu()
  }, true)
  window.addEventListener('contextmenu', function (e) {
    e.preventDefault()
    openMenuAt()
  })

  // --- drag: only from the pet image, JS-driven window move ---
  function syncCursor() {
    imgEl.style.cursor = lockedNow ? 'default' : 'grab'
  }
  imgEl.addEventListener('mousedown', function (e) {
    if (e.button !== 0 || lockedNow) return
    dragState = { x: e.screenX, y: e.screenY, moved: false }
    imgEl.style.cursor = 'grabbing'
  })
  window.addEventListener('mousemove', function (e) {
    if (!dragState) return
    if (!(e.buttons & 1)) { dragState = null; syncCursor(); return } // mouse released outside
    var dx = e.screenX - dragState.x
    var dy = e.screenY - dragState.y
    if (Math.abs(dx) + Math.abs(dy) > 6) dragState.moved = true
    if (window.petBridge) {
      window.petBridge.moveWindow(dx, dy)
    }
    dragState = { x: e.screenX, y: e.screenY, moved: dragState.moved }
  })
  window.addEventListener('mouseup', function () {
    if (dragState && !dragState.moved) {
      // plain click: switch mood, same as the in-page pet
      var moods = ['01', '02', '03', '04', '05', '06', '07']
      var current = lastSnapshot ? (lastSnapshot.mood || '06') : '06'
      var pick = moods.filter(function (m) { return m !== current })
      moodOverride = { mood: pick[Math.floor(Math.random() * pick.length)], until: Date.now() + 1800 }
      apply(lastSnapshot)
    }
    dragState = null
    syncCursor()
  })

  function mk(tag, style, text) {
    var n = document.createElement(tag)
    if (style) n.style.cssText = style
    if (text !== undefined) n.textContent = text
    return n
  }
  function stateRank(state) {
    switch (state) {
      case 'WAITING': return 60
      case 'ERROR': return 50
      case 'SUCCESS': return 70
      case 'WORKING': return 30
      case 'THINKING': return 20
      case 'DISCONNECTED': return -1
      default: return 0
    }
  }
  function attentionOf(entry) {
    return entry.attention === true || entry.state === 'WAITING' || entry.state === 'ERROR'
  }
  function completionOf(entry) {
    return entry.completionNotification === true
  }
  function targetSessionOf(entry) {
    return entry.targetSessionId || entry.sessionId
  }
  function approvalOf(entry) {
    return entry.approval === true
  }
  function orderSessions(sessions) {
    return sessions.slice().sort(function (a, b) {
      var aDone = completionOf(a) ? 1 : 0
      var bDone = completionOf(b) ? 1 : 0
      if (aDone !== bDone) return bDone - aDone
      var aAtt = attentionOf(a) ? 1 : 0
      var bAtt = attentionOf(b) ? 1 : 0
      if (aAtt !== bAtt) return bAtt - aAtt
      var aCur = a.sessionId === currentSessionId ? 1 : 0
      var bCur = b.sessionId === currentSessionId ? 1 : 0
      if (aCur !== bCur) return bCur - aCur
      var priority = stateRank(b.state) - stateRank(a.state)
      return priority || (b.updatedAt || 0) - (a.updatedAt || 0)
    })
  }
  function openSession(sessionId, completed) {
    if (!sessionId) return
    fetch(SESSION_OPEN_ENDPOINT, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId: sessionId, approve: false, completed: completed === true }),
    }).catch(function () {})
  }
  function approveSession(sessionId) {
    if (!sessionId) return
    fetch(SESSION_OPEN_ENDPOINT, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId: sessionId, approve: true }),
    }).catch(function () {})
  }
  function ensureBubbleEl(sessionId) {
    var existing = bubbleEls.get(sessionId)
    if (existing) return existing
    var node = mk('div', 'display:none;')
    node.className = 'rm2-pet-bubble'
    node.setAttribute('role', 'button')
    node.tabIndex = 0
    var header = mk('div', '')
    header.className = 'rm2-pet-bubble-header'
    var completion = mk('span', '')
    completion.className = 'rm2-pet-bubble-completion'
    header.appendChild(completion)
    var action = mk('span', '', '')
    action.className = 'rm2-pet-bubble-action'
    action.setAttribute('aria-label', '蕾米埃尔桌宠')
    var brandImg = document.createElement('img')
    brandImg.src = '/favicon.svg'
    brandImg.alt = ''
    action.appendChild(brandImg)
    var title = mk('div', '')
    title.className = 'rm2-pet-bubble-title'
    header.appendChild(title)
    header.appendChild(action)
    var detail = mk('div', '')
    detail.className = 'rm2-pet-bubble-detail'
    var detailText = document.createElement('span')
    detailText.className = 'rm2-pet-detail-text'
    detail.appendChild(detailText)
    var stackCount = document.createElement('span')
    stackCount.className = 'rm2-pet-bubble-stack-count'
    node.appendChild(header)
    node.appendChild(detail)
    node.appendChild(stackCount)
    var el = { node: node, header: header, title: title, detail: detail, detailText: detailText, action: action, brandImg: brandImg, stackCount: stackCount, targetSessionId: sessionId, canApprove: false, lastText: '', lastDetail: '', naturalHeaderWidth: 0, titleMood: '', titleChangedAt: 0, titleTimer: 0, pendingTitle: '', pendingMood: '' }
    var activate = function (event) {
      event.preventDefault()
      event.stopPropagation()
      if (el.node.dataset.idlePlaceholder === 'true') return
      openSession(el.targetSessionId, el.completed)
    }
    action.addEventListener('click', function (event) {
      event.preventDefault()
      event.stopPropagation()
      if (el.canApprove) approveSession(el.targetSessionId)
      else openSession(el.targetSessionId, false)
    })
    node.addEventListener('pointerdown', function (event) { event.stopPropagation() })
    node.addEventListener('click', activate)
    node.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') activate(event)
    })
    bubbleStack.appendChild(node)
    bubbleEls.set(sessionId, el)
    return el
  }
  function clearBubbleTitleTimer(el) {
    if (el && el.titleTimer) {
      window.clearTimeout(el.titleTimer)
      el.titleTimer = 0
    }
  }
  function commitBubbleTitle(el, text, mood) {
    clearBubbleTitleTimer(el)
    el.titleMood = mood
    el.titleChangedAt = Date.now()
    el.pendingTitle = ''
    el.pendingMood = ''
    if (text !== el.lastText) {
      el.lastText = text
      el.title.textContent = text
    }
  }
  function applyBubbleTitle(el, entry) {
    var text = entry.message || ''
    var mood = entry.mood || ''
    var state = entry.state || ''
    var immediate = !text
      || state === 'WAITING' || state === 'ERROR' || state === 'SUCCESS'
      || entry.attention === true
      || entry.completionNotification === true
      || entry.idlePlaceholder === true
    if (!el.titleChangedAt) {
      commitBubbleTitle(el, text, mood)
      return
    }
    var moodChanged = mood !== el.titleMood
    var elapsed = Date.now() - el.titleChangedAt
    if (immediate || moodChanged || elapsed >= BUBBLE_TITLE_MS) {
      commitBubbleTitle(el, text, mood)
      return
    }
    if (text === el.lastText) {
      el.pendingTitle = ''
      clearBubbleTitleTimer(el)
      return
    }
    el.pendingTitle = text
    el.pendingMood = mood
    if (!el.titleTimer) {
      el.titleTimer = window.setTimeout(function () {
        el.titleTimer = 0
        if (el.pendingTitle && el.pendingTitle !== el.lastText) {
          commitBubbleTitle(el, el.pendingTitle, el.pendingMood || el.titleMood)
        }
      }, Math.max(16, BUBBLE_TITLE_MS - elapsed))
    }
  }
  function renderBubble(el, entry, index) {
    var text = entry.message || ''
    var detail = entry.detail || ''
    if (!text && !detail) {
      commitBubbleTitle(el, '', entry.mood || '')
      el.node.style.display = 'none'
      return
    }
    applyBubbleTitle(el, entry)
    el.detail.style.display = detail ? 'block' : 'none'
    if (detail !== el.lastDetail) {
      el.lastDetail = detail
      el.detailText.textContent = detail.replace(/^\s*[·•]\s*/, '· ')
    }
    var attention = attentionOf(entry)
    var approval = approvalOf(entry)
    var completed = completionOf(entry)
    el.targetSessionId = targetSessionOf(entry)
    el.canApprove = approval
    el.completed = completed
    var actionNotif = approval || (attention && !completed)
    if (actionNotif) {
      var glyph = approval ? '✓' : entry.phase === 'ask' ? '?' : '!'
      if (el.action.textContent !== glyph) el.action.textContent = glyph
      el.action.setAttribute('aria-label', approval ? '允许一次，点击直接确认' : completed ? '任务已完成，点击查看' : '需要处理，点击跳转')
    } else if (el.action.firstChild !== el.brandImg) {
      el.action.textContent = ''
      el.action.appendChild(el.brandImg)
      el.action.setAttribute('aria-label', '蕾米埃尔桌宠')
    }
    el.stackCount.textContent = entry.summaryCount ? '+' + entry.summaryCount : ''
    el.node.className = 'rm2-pet-bubble' + (index === 0 ? ' top' : '') + (attention ? ' attention' : '') + (approval ? ' approval' : '') + (completed ? ' completed' : '') + (entry.idlePlaceholder ? ' idle-placeholder' : '') + (entry.summaryCount ? ' summary-backboard' : '')
    el.node.setAttribute('aria-disabled', entry.idlePlaceholder ? 'true' : 'false')
    el.node.style.cursor = entry.idlePlaceholder ? 'default' : 'pointer'
    el.node.dataset.idlePlaceholder = entry.idlePlaceholder ? 'true' : 'false'
    el.node.title = approval ? '允许一次：点击圆形勾号直接确认' : completed ? '任务已完成：点击查看结果' : attention ? '需要处理：点击跳转到此对话' : '点击跳转到此对话'
    el.node.style.zIndex = String(100 - index)
    el.node.style.order = String(index)
    el.node.style.marginTop = index === 0 ? '0px' : '-60px'
    el.node.style.width = '100%'
    el.node.style.opacity = index === 0 ? '1' : String(Math.max(0.46, 0.82 - index * 0.1))
    el.node.style.display = 'block'
  }
  function updateBubbles(snapshot) {
    if (!snapshot) return
    var sessions = Array.isArray(snapshot.sessions)
      ? snapshot.sessions
      : [snapshot]
    sessions = sessions.filter(function (entry) {
      return entry && entry.state !== 'IDLE' && entry.state !== 'DISCONNECTED'
    })
    if (sessions.length === 0 && snapshot.enabled !== false) {
      sessions = [{
        sessionId: '__pet_idle__',
        state: 'IDLE',
        mood: snapshot.mood || '06',
        message: snapshot.message || '蕾米埃尔待命中',
        detail: '',
        phase: 'idle',
        updatedAt: snapshot.updatedAt || 0,
        idlePlaceholder: true,
      }]
    }
    var ordered = orderSessions(sessions)
    lastTopEntry = ordered[0] || null
    if (lastTopEntry && lastTopEntry.mood) snapshot.mood = lastTopEntry.mood
    var visibleEntries = ordered.slice(0, MAX_BUBBLES)
    if (visibleEntries.length > 1) {
      visibleEntries[1] = Object.assign({}, visibleEntries[1], { summaryCount: ordered.length - 1 })
    }
    var count = visibleEntries.length
    var seen = new Set()
    var measuredWidth = 150
    bubbleStack.style.width = 'fit-content'
    for (var i = 0; i < count; i++) {
      var entry = visibleEntries[i]
      seen.add(entry.sessionId)
      var stackedEl = ensureBubbleEl(entry.sessionId)
      if (stackedEl.node.parentNode !== bubbleStack) bubbleStack.appendChild(stackedEl.node)
      renderBubble(stackedEl, entry, i)
      stackedEl.node.style.minWidth = '150px'
      stackedEl.node.style.width = 'max-content'
      stackedEl.node.style.maxWidth = 'none'
      stackedEl.node.classList.remove('title-clipped')
      var titleWidth = stackedEl.title.scrollWidth || stackedEl.title.offsetWidth || 0
      var actionWidth = 30
      var completionWidth = completionOf(entry) ? 22 : 0
      stackedEl.naturalHeaderWidth = titleWidth + actionWidth + completionWidth
      var detailW = stackedEl.detail.scrollWidth || stackedEl.detail.offsetWidth || 0
      if (i === 0) measuredWidth = Math.max(stackedEl.naturalHeaderWidth, detailW)
      stackedEl.node.style.maxWidth = ''
      stackedEl.node.style.width = '100%'
    }
    var deckWidth = bubbleRowWidth(measuredWidth)
    var deckWidthPx = deckWidth + 'px'
    if (bubbleStack.style.width !== deckWidthPx) bubbleStack.style.width = deckWidthPx
    for (var j = 0; j < count; j++) {
      var renderEntry = visibleEntries[j]
      var renderEl = bubbleEls.get(renderEntry.sessionId)
      renderBubble(renderEl, renderEntry, j)
      renderEl.node.classList.toggle('title-clipped', renderEl.naturalHeaderWidth > Math.max(0, deckWidth - 50))
    }
    for (var key of bubbleEls.keys()) {
      if (!seen.has(key)) {
        var gone = bubbleEls.get(key)
        clearBubbleTitleTimer(gone)
        if (gone && gone.node && gone.node.remove) gone.node.remove()
        bubbleEls.delete(key)
      }
    }
    if (bubbleDots && ordered[0] && bubbleEls.get(ordered[0].sessionId)) {
      var topNode = bubbleEls.get(ordered[0].sessionId).node
      if (bubbleDots.parentNode !== topNode) topNode.appendChild(bubbleDots)
    }
    bubbleStack.style.display = snapshot.bubble !== false && count > 0 ? 'flex' : 'none'
    if (count === 0) bubbleStack.style.width = ''
  }

  function applyTransform(mood, snapshot) {
    var scale = snapshot.scale || 1
    imgEl.style.width = Math.round(180 * scale) + 'px'
    imgEl.style.transform = ''
  }

  function apply(snapshot) {
    if (!snapshot || snapshot.kind) return
    lastSnapshot = snapshot
    if (window.__petBalance) {
      if (!window.__petBalanceInited) {
        window.__petBalanceInited = true
        window.__petBalance.init(snapshot.usageMode || 'ledger')
      } else if (snapshot.usageMode) {
        window.__petBalance.setUsageMode(snapshot.usageMode)
      }
    }
    lockedNow = snapshot.locked === true
    syncCursor()
    // 禁用桌宠或隐藏桌宠：隐藏宠物与气泡
    if (snapshot.enabled === false || snapshot.hidden === true) {
      imgEl.style.display = 'none'
      bubbleEl.style.display = 'none'
      bubbleStack.style.display = 'none'
      return
    }
    imgEl.style.display = 'block'
    setPetPaused(snapshot.paused === true)
    // 翻页逻辑：双开时 currentBubblePage 决定显示哪个子项；单开时强制显示开启的子项
    var statusOn = snapshot.showBubble !== false && snapshot.showBubbleStatus !== false
    var usageOn = snapshot.showBubble !== false && snapshot.showBubbleUsage === true
    var bothOn = statusOn && usageOn
    var anyOn = statusOn || usageOn
    // 气泡从无到有时回到状态页
    var bubbleEnabled = snapshot.showBubble !== false && anyOn
    if (bubbleEnabled && !prevBubbleVisible && currentBubblePage !== 0) {
      currentBubblePage = 0
      balanceFrame = null
      balanceRequested = false
      lastBubbleMood = ''; lastBubbleText = ''; lastBubbleDetail = ''
    }
    prevBubbleVisible = bubbleEnabled
    // 强制页面归属
    var pageBefore = currentBubblePage
    if (!statusOn && usageOn && currentBubblePage === 0) { currentBubblePage = 1 }
    if (statusOn && !usageOn) { currentBubblePage = 0 }
    if (statusOn && usageOn && currentBubblePage > 1) currentBubblePage = 0
    if (currentBubblePage !== pageBefore) {
      lastBubbleMood = ''; lastBubbleText = ''; lastBubbleDetail = ''
      if (currentBubblePage === 0) balanceFrame = null
    }
    if (currentBubblePage === 1 && !(balanceFrame && balanceFrame.kind === 'balance') && window.__petBalance && !balanceRequested) {
      balanceRequested = true
      window.setTimeout(function () { if (window.__petBalance) window.__petBalance.showBalance() }, 0)
    }
    if (currentBubblePage === 0) balanceRequested = false
    bubbleEl.style.pointerEvents = bothOn && snapshot.showBubble !== false ? 'auto' : 'none'
    bubbleDots.style.display = bothOn ? '' : 'none'
    bubbleDot.title = currentBubblePage === 0 ? '切到余额' : '切到状态'
    var cur = currentBubblePage
    var show = anyOn && (cur === 0 ? statusOn : usageOn)
    if (cur === 0) {
      show = show && statusOn
      bubbleStack.style.display = show ? 'flex' : 'none'
      if (show) updateBubbles(snapshot)
      bubbleEl.style.display = 'none'
      bubbleEl.classList.remove('rm2-bubble-balance')
      titleEl.textContent = ''
      detailEl.textContent = ''
    } else if (cur === 1) {
      bubbleStack.style.display = 'none'
      if (bubbleDots.parentNode !== bubbleEl) bubbleEl.appendChild(bubbleDots)
      bubbleEl.classList.add('rm2-bubble-balance')
      show = show && !!balanceFrame && balanceFrame.kind === 'balance'
      bubbleEl.style.display = (show || bothOn) ? 'block' : 'none'
      if (show) {
        titleEl.textContent = (balanceFrame.label || 'DeepSeek 余额') + '  ' + (balanceFrame.amount || '--')
        titleEl.style.color = ''
        detailEl.innerHTML = (balanceFrame.detail || '') + ' · <span style="color:' + (balanceFrame.color || '#888') + '">' + (balanceFrame.period || '') + '</span>'
        var titleText = (balanceFrame.label || 'DeepSeek 余额') + '  ' + (balanceFrame.amount || '--')
        var detailText = (balanceFrame.detail || '') + ' · ' + (balanceFrame.period || '')
        var maxTextW = Math.max(measureTextW(titleEl, titleText), measureTextW(detailEl, detailText))
        bubbleEl.style.width = bubbleRowWidth(maxTextW) + 'px'
      } else {
        titleEl.textContent = '余额加载中…'
        detailEl.textContent = ''
      }
    }
    var mood = moodOverride && moodOverride.until > Date.now() ? moodOverride.mood : (snapshot.mood || '06')
    var src = '/plugins/dsh-pet-remielle/assets/' + encodeURIComponent(snapshot.petId || 'remielle') + '/' + mood + '.gif'
    if (!petPaused && imgEl.dataset.mood !== mood) {
      imgEl.src = src
      imgEl.dataset.mood = mood
    }
    applyTransform(mood, snapshot)
    imgEl.style.opacity = String(snapshot.opacity ?? 1)
  }

  var source
  try { source = new EventSource('/plugins/dsh-pet-remielle/stream') } catch (e) { /* fallback to polling */ }
  if (source) {
    source.onmessage = function (e) {
      try { apply(JSON.parse(e.data)) } catch (err) { /* ignore malformed frame */ }
    }
  }
  function poll() {
    fetch('/plugins/dsh-pet-remielle/state', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null })
      .then(apply)
      .catch(function () {})
  }
  setInterval(poll, 5000)
  poll()

  // 余额控制器：把显示帧渲染进自带气泡
  if (window.__petBalance) {
    window.__petBalance.subscribe(function (frame) {
      // 只存数据，不直接渲染气泡；气泡渲染统一由 apply 根据 currentBubblePage 决定
      balanceFrame = frame
      // 延迟渲染，避免与快照驱动的 apply 重入竞争
      if (currentBubblePage === 1 && lastSnapshot) {
        window.setTimeout(function () { if (currentBubblePage === 1 && lastSnapshot) apply(lastSnapshot) }, 0)
      }
    })
  }

  // Double-click (or menu 画画): drawing sticker loop + brush-reveal artwork.
  // Renders off-screen and streams frames to a desktop-top-right window (via
  // petBridge) so it never covers the pet bubble; falls back to an in-window
  // canvas if no bridge is available.
  function playDraw() {
    if (!lastSnapshot || !lastSnapshot.pics) return
    var PIC_DRAW_MS = 6000 // 绘制时长 == 显示“绘制中(01)”的时长
    moodOverride = { mood: '01', until: Date.now() + PIC_DRAW_MS }
    apply(lastSnapshot)
    var n = Math.floor(Math.random() * lastSnapshot.pics) + 1
    var src = '/plugins/dsh-pet-remielle/assets/' + encodeURIComponent(lastSnapshot.petId || 'remielle') + '/pics/' + n + '.png'
    var img = new Image()
    img.onload = function () {
      runBrushReveal(img, img.naturalWidth || 220, img.naturalHeight || 220)
    }
    img.src = src
  }

  function runBrushReveal(img, W, H) {
    var useElectron = !!(window.petBridge && window.petBridge.artworkOpen && window.petBridge.artworkSet)
    // 显示尺寸（约 240px 宽，控制高度上限，保证 PNG 帧不至于过大）
    var dispW = 240
    var dispH = Math.max(60, Math.min(420, Math.round(240 * H / W)))
    var cv = document.createElement('canvas')
    cv.width = dispW; cv.height = dispH
    var g = cv.getContext('2d')
    g.clearRect(0, 0, dispW, dispH)
    var D = dispW + dispH
    var r = Math.max(dispW, dispH) * 0.15
    var T = 6000
    var t0 = null
    var shown = false
    var lastPush = -1

    function openTarget() {
      if (useElectron) {
        window.petBridge.artworkOpen(dispW, dispH)
      } else {
        cv.style.cssText = 'position:fixed;right:24px;top:24px;width:' + dispW + 'px;height:auto;border-radius:10px;display:block;cursor:pointer;z-index:9999;'
        cv.title = '点击关闭'
        cv.addEventListener('click', function () { if (cv.parentNode) document.body.removeChild(cv) })
        document.body.appendChild(cv)
      }
      shown = true
    }
    function pushFrame(now) {
      if (!shown) openTarget()
      if (!useElectron) return // 窗口内画布本身就是实时显示的
      if (now - lastPush < 33) return // ~30fps，避免 IPC 过载
      lastPush = now
      window.petBridge.artworkSet(cv.toDataURL('image/png'))
    }
    function lineAt(dd) {
      var ax = Math.max(0, dd - dispH), ay = dd - ax
      var by = Math.max(0, dd - dispW), bx = dd - by
      return { ax: ax, ay: ay, bx: bx, by: by }
    }
    function frame(ts) {
      if (t0 === null) t0 = ts
      var p = Math.min(1, (ts - t0) / T)
      if (p >= 1) {
        g.globalAlpha = 1
        g.globalCompositeOperation = 'source-over'
        g.drawImage(img, 0, 0, W, H, 0, 0, dispW, dispH)
        pushFrame(ts)
        // 绘制完成：切“得意中(03)”，保持片刻后 0.8s 淡出再关闭
        moodOverride = { mood: '03', until: Date.now() + 2200 }
        apply(lastSnapshot)
        setTimeout(function () {
          if (useElectron) window.petBridge.artworkFade()
          else if (cv.parentNode) {
            cv.style.transition = 'opacity 0.8s ease-out'
            cv.style.opacity = '0'
          }
          setTimeout(function () {
            if (useElectron) window.petBridge.artworkClose()
            else if (cv.parentNode) document.body.removeChild(cv)
          }, 800)
        }, 2200)
        return
      }
      var d = D * p
      var L = lineAt(d)
      var half = 440
      var ph = (ts - t0) % (half * 2)
      var s = ph < half ? ph / half : 1 - (ph - half) / half
      for (var k = 0; k < 2; k++) {
        var sk = Math.min(1, Math.max(0, s + k * 0.04))
        var cx = L.bx + (L.ax - L.bx) * sk
        var cy = L.by + (L.ay - L.by) * sk
        // 笔刷路径加一点小小的随机
        cx += (Math.random() - 0.5) * r * 0.6
        cy += (Math.random() - 0.5) * r * 0.6
        var rr = r * (0.85 + 0.3 * Math.random())
        g.save()
        g.beginPath()
        g.arc(cx, cy, rr, 0, Math.PI * 2)
        g.clip()
        g.globalAlpha = 1
        g.globalCompositeOperation = 'source-over'
        g.drawImage(img, 0, 0, W, H, 0, 0, dispW, dispH)
        g.restore()
      }
      pushFrame(ts)
      window.requestAnimationFrame(frame)
    }
    window.requestAnimationFrame(frame)
  }
  window.addEventListener('dblclick', playDraw)

  // Mouse wheel: resize the pet (persisted through host config).
  window.addEventListener('wheel', function (e) {
    e.preventDefault()
    if (!lastSnapshot) return
    var delta = e.deltaY < 0 ? 0.05 : -0.05
    var next = Math.min(2, Math.max(0.5, (lastSnapshot.scale || 1) + delta))
    next = Math.round(next * 20) / 20
    fetch('/plugins/dsh-pet-remielle/config', {
      method: 'PATCH',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ scale: next }),
    }).catch(function () {})
  }, { passive: false })

  // Remember the window position across restarts.
  try {
    var saved = JSON.parse(localStorage.getItem('dsh-pet-window-pos') || 'null')
    if (saved && typeof saved.x === 'number' && typeof saved.y === 'number') {
      window.moveTo(saved.x, saved.y)
    }
  } catch (e) { /* storage unavailable */ }
  setInterval(function () {
    try {
      localStorage.setItem('dsh-pet-window-pos', JSON.stringify({ x: window.screenX, y: window.screenY }))
    } catch (e) { /* storage unavailable */ }
  }, 2000)
</script>
</body>
