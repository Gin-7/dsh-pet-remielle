# remielle pet bundle patch: inserts its public dsh.client entry into the web plugin roster.
# The bundle is the official dsh plugin shape — install it with
# `dsh plugin --profile <name> add <path-or-git-url>`.
# `inject: [webServer]` defers this host row until the webserver service exists,
# so the update/check routes can register once the HTTP carrier is up.
- insert:
    - id: ui-pet-remielle
      name: '@dsh-external/dsh-client-ui-pet-remielle'
      inject: [webServer]
