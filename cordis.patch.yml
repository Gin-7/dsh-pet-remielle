# remielle v2 bundle patch: inserts the plugin row into the web plugin roster.
# Install with `dsh plugin --profile <name> add <path-or-git-url>`.
- insert:
    - id: dsh-pet-remielle
      name: dsh-pet-remielle
      config:
        enabled: true
        scale: 1
        opacity: 1
        locked: false
        includeSubagents: false
